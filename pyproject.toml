[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-apac-face-dataset-generator"
version = "1.0.0"
description = "Privacy-safe synthetic APAC patient face dataset generator"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["backend*", "generation*"]